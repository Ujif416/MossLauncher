<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://sessionserver.mojang.com https://api.minecraftservices.com https://cdn.modrinth.com https://media.forgecdn.net; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'"
  />
  <title>MossLauncher</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="titlebar">
    <div class="titlebar__drag">MossLauncher</div>
    <button class="titlebar__btn" data-action="minimize" title="Свернуть" aria-label="Свернуть">&#x2013;</button>
    <button class="titlebar__btn" data-action="maximize" title="Развернуть" aria-label="Развернуть">&#x25A1;</button>
    <button class="titlebar__btn titlebar__btn--close" data-action="close" title="Закрыть" aria-label="Закрыть">&#x2715;</button>
  </div>

  <div id="app">
    <div class="loader">
      <img src="assets/loading/frame-04.png" alt="" />
      <p>Загрузка MossLauncher…</p>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
