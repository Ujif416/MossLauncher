name: Mirror Skybound to Timeweb
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish client pack"]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: skybound-timeweb
  cancel-in-progress: false
jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: python -m pip install boto3
      - name: Publish pack
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TWC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TWC_SECRET_ACCESS_KEY }}
        run: python launcher/timeweb.py pack
      - name: Download launcher release and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.15 -R Ujif416/MossLauncher -D release -p '*.exe' -p SHA256SUMS.txt
          cd release
          sha256sum --check SHA256SUMS.txt
      - name: Publish installers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TWC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TWC_SECRET_ACCESS_KEY }}
        run: python launcher/timeweb.py installers
